<!DOCTYPE html>
<html lang="fil"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PC Building Simulator – CSS</title>
<style>
:root{--bg:#0d1220;--card:#161d33;--ink:#e8ecf8;--mute:#8d97b8;--acc:#4f8cff;--ok:#2fd18b;--bad:#ff5d6c;--line:#27315a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#eef2fb;--card:#fff;--ink:#17213d;--mute:#5d6a8f;--line:#d3dbf0}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,"Segoe UI",Roboto,sans-serif;padding:14px;max-width:1180px;margin:auto}
h1{font-size:1.25rem;margin:0}header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:.8rem;color:var(--mute)}.stat b{display:block;font-size:1.05rem;color:var(--ink)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button,.tab{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:9px;padding:8px 13px;font-size:.85rem;transition:.2s}
button:hover{border-color:var(--acc)}.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}@media(max-width:900px){.grid{grid-template-columns:1fr}}
.stagewrap{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
#stage{position:relative;width:100%;aspect-ratio:16/10;border-radius:12px;overflow:hidden;background:linear-gradient(135deg,#232b45,#141a2e);border:6px solid #3a4468;box-shadow:inset 0 0 40px #0008}
#stage::before{content:"";position:absolute;inset:0;background:radial-gradient(#ffffff14 1.5px,transparent 2px) 0 0/22px 22px}
.part{position:absolute;border-radius:6px;cursor:pointer;transition:transform .55s cubic-bezier(.3,1.4,.5,1),opacity .4s,filter .2s;display:flex}
.part .lbl{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(7px,1.15vw,12px);font-weight:700;background:#0009;color:#fff;padding:1px 6px;border-radius:20px;white-space:nowrap;pointer-events:none;z-index:5}
#stage.nolbl .lbl{display:none}
.part.on:hover{filter:brightness(1.3) drop-shadow(0 0 8px var(--acc))}
.part.off{opacity:0;transform:translateY(-40px) scale(.9);pointer-events:none}
.asm .part.off{opacity:.45;transform:none;pointer-events:auto;outline:2px dashed #fff8;background:#ffffff14!important;background-image:none!important;border-color:transparent!important;box-shadow:none!important}
.part.pick{opacity:1!important;outline:3px solid var(--ok)!important;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 22px var(--ok)}}
.part.bad{animation:shake .4s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.part.target{outline:3px solid #ffd24a;animation:pulse 1s infinite}
.psu{background:linear-gradient(#5b6376,#353c4d);border:2px solid #8a93aa}
.psu::before{content:"";position:absolute;left:8%;top:12%;width:42%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(#222 0 3px,#444 3px 6px)}
.mb{background:linear-gradient(135deg,#0f7a4f,#0a5c3b);border:2px solid #29c78a;box-shadow:0 0 0 2px #0006}
.mb::before{content:"";position:absolute;inset:6%;background:repeating-linear-gradient(90deg,#ffffff10 0 2px,transparent 2px 14px)}
.cpu{background:linear-gradient(#cfd6e6,#97a0b8);border:2px solid #fff;color:#222}
.cooler{border-radius:50%!important;background:conic-gradient(#3a7bff,#16254f,#3a7bff,#16254f,#3a7bff,#16254f,#3a7bff);border:4px solid #8fb0ff;animation:spin 2.5s linear infinite}
.cooler .lbl{animation:spin 2.5s linear infinite reverse;transform-origin:center}
.ram{background:linear-gradient(90deg,#222,#444);border:2px solid #ffb347;background-image:repeating-linear-gradient(0deg,#ffb34755 0 6px,transparent 6px 16px)}
.ram .lbl{writing-mode:vertical-rl}
.gpu{background:linear-gradient(#262a38,#12141c);border:2px solid #ff4d6d}
.gpu::before,.gpu::after{content:"";position:absolute;top:10%;height:80%;aspect-ratio:1;border-radius:50%;background:conic-gradient(#555,#111,#555,#111,#555);border:3px solid #ff4d6d;animation:spin 2s linear infinite}
.gpu::before{left:8%}.gpu::after{right:8%}
.ssd{background:linear-gradient(#2d5cff,#1b2f80);border:2px solid #9fb6ff}
.hdd{background:linear-gradient(#aab,#778);border:2px solid #dde;color:#111}
.hdd::before{content:"";position:absolute;left:12%;top:10%;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(#ccc 0 12%,#333 13% 40%,#999 41%);border:2px solid #444}
.cable{background:repeating-linear-gradient(90deg,#ff9d2e 0 10px,#e0701a 10px 20px);border:2px solid #ffcf8a;border-radius:20px}
.fan{border-radius:50%!important;background:conic-gradient(#1c1f2b,#3de0ff,#1c1f2b,#3de0ff,#1c1f2b,#3de0ff,#1c1f2b);border:5px solid #aef;animation:spin 3s linear infinite;justify-content:center}
.fan .lbl{animation:spin 3s linear infinite reverse}
.off.fan,.off.cooler,.off.gpu::before,.off.gpu::after{animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.side{display:flex;flex-direction:column;gap:12px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
.box h3{margin:0 0 8px;font-size:.9rem;color:var(--acc)}
#info .nm{font-size:1.1rem;font-weight:700}#info p{margin:6px 0;font-size:.85rem;line-height:1.45;color:var(--mute)}#info b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{padding:5px 10px;font-size:.78rem}.chip.sel{background:var(--ok);color:#06281a;border-color:var(--ok)}
.prog{height:8px;background:var(--line);border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--ok));transition:width .4s}
#log{max-height:140px;overflow:auto;font-size:.78rem;color:var(--mute);line-height:1.5}#log div.e{color:var(--bad)}#log div.g{color:var(--ok)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:#1b2340;color:#fff;border:1px solid var(--acc);padding:10px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:20;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.err{border-color:var(--bad);background:#3a1620}
label.sw{display:flex;gap:6px;align-items:center;font-size:.85rem;cursor:pointer}
#esd.warn{animation:pulse 1s infinite}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
</style></head><body>
<header>
<h1>🖥️ PC Building Simulator <span style="color:var(--mute);font-weight:400;font-size:.85rem">· CSS: Assembly &amp; Disassembly</span></h1>
<div class="stats"><div class="stat">Score<b id="score">100</b></div><div class="stat">Hakbang<b id="steps">0</b></div><div class="stat">Oras<b id="time">0:00</b></div></div>
</header>
<div class="tabs" id="tabs"></div>
<div class="grid">
<div class="stagewrap">
<div id="stage"></div>
<div class="row" style="align-items:center;justify-content:space-between">
<div class="row" style="margin:0;gap:14px">
<label class="sw" id="esd"><input type="checkbox" id="strap"> 🧤 Anti-static wrist strap</label>
<label class="sw"><input type="checkbox" id="lblT" checked> Ipakita ang pangalan</label>
</div>
<div class="row" style="margin:0"><button id="auto">▶ Auto</button><button id="reset">↺ Reset</button></div>
</div>
</div>
<div class="side">
<div class="box" id="info"><h3>📘 Impormasyon</h3><div class="nm">Pumili ng parte</div><p>I-click ang kahit anong parte ng PC para makita ang pangalan at gamit nito.</p></div>
<div class="box"><h3>🧩 Progress <span id="pc" style="color:var(--mute)"></span></h3><div class="prog"><i id="bar"></i></div>
<div class="chips" id="tray" style="margin-top:10px"></div></div>
<div class="box"><h3>📝 Log</h3><div id="log"></div></div>
</div></div>
<div id="toast"></div>
<script>
const P=[
{id:'psu',name:'Power Supply (PSU)',x:4,y:74,w:26,h:20,deps:[],fn:'Nagko-convert ng AC papuntang DC at nagbibigay ng kuryente sa lahat ng parte.',tip:'Ikabit muna ito bago ang ibang parte. Kailangang tugma ang wattage (hal. 550W–750W).'},
{id:'mb',name:'Motherboard',x:34,y:7,w:42,h:64,deps:['psu'],z:1,fn:'Pangunahing circuit board kung saan nakakabit ang CPU, RAM, GPU at storage.',tip:'I-align sa standoffs at lagyan ng I/O shield bago i-screw.'},
{id:'cpu',name:'CPU',x:47,y:15,w:10,h:15,deps:['mb'],z:2,fn:'Ang “utak” ng computer; nagpoproseso ng mga instruction.',tip:'I-align ang gold triangle sa socket. Huwag pilitin ang pagpasok.'},
{id:'cooler',name:'CPU Fan',x:44.5,y:11,w:15,h:23,deps:['cpu'],z:4,fn:'Nagpapalamig sa CPU gamit ang heatsink at fan.',tip:'Lagyan ng thermal paste (size ng gisantes) bago ikabit.'},
{id:'ram1',name:'RAM 1',x:63.5,y:11,w:3.6,h:34,deps:['mb'],z:3,fn:'Pansamantalang memory para sa mga running program.',tip:'Itulak hanggang mag-“click” ang clips sa magkabilang dulo.'},
{id:'ram2',name:'RAM 2',x:68,y:11,w:3.6,h:34,deps:['mb'],z:3,fn:'Pangalawang RAM stick para sa dual-channel mode (mas mabilis).',tip:'Ilagay sa alternate slot (A2/B2) para sa dual-channel.'},
{id:'ssd',name:'M.2 SSD',x:37.5,y:37,w:15,h:5,deps:['mb'],z:3,fn:'Mabilis na storage para sa operating system at programs.',tip:'I-screw ang dulo nito sa standoff pagkatapos isaksak sa slot.'},
{id:'gpu',name:'Graphics Card (GPU)',x:36.5,y:47,w:38,h:12,deps:['mb'],z:3,fn:'Nagpoproseso ng graphics para sa games, video at display.',tip:'Ikabit sa PCIe x16 slot at i-screw sa case bracket.'},
{id:'hdd',name:'Hard Disk (HDD)',x:79,y:42,w:17,h:27,deps:['psu'],z:2,fn:'Malaking storage para sa files, videos at backup.',tip:'Kailangan ng SATA data cable at SATA power connector.'},
{id:'cable',name:'Power Cables (24-pin / 8-pin)',x:31.5,y:78,w:44,h:6,deps:['psu','mb'],z:3,fn:'Nagdadala ng kuryente mula PSU papunta sa motherboard at CPU.',tip:'Isaksak ang 24-pin ATX at 8-pin CPU power hanggang mag-lock.'},
{id:'fan',name:'Case Fan',x:79,y:8,w:17,h:27,deps:[],z:2,fn:'Naglalabas ng mainit na hangin at nagpapadaloy ng hangin sa loob ng case.',tip:'Bigyang-pansin ang direksyon ng arrow sa gilid ng fan.'}];
const $=s=>document.querySelector(s),stage=$('#stage');
const S={on:{},mode:'explore',sel:null,score:100,steps:0,t0:0,tm:null,quiz:null,auto:false};
const MODES={explore:'🔍 Explore',dis:'🔧 Disassembly',asm:'🛠️ Assembly',quiz:'🎯 Quiz'};
const by=id=>P.find(p=>p.id===id);
P.forEach(p=>{const d=document.createElement('div');d.className='part '+(p.id.startsWith('ram')?'ram ':p.id)+' off';d.id='p-'+p.id;
Object.assign(d.style,{left:p.x+'%',top:p.y+'%',width:p.w+'%',height:p.h+'%',zIndex:p.z||2});
d.innerHTML='<span class="lbl">'+p.name+'</span>';d.onclick=()=>click(p);stage.appendChild(d)});
Object.entries(MODES).forEach(([k,v])=>{const b=document.createElement('button');b.className='tab';b.textContent=v;b.id='t-'+k;b.onclick=()=>setMode(k);$('#tabs').appendChild(b)});
function toast(m,e){const t=$('#toast');t.textContent=m;t.className='show'+(e?' err':'');clearTimeout(t._);t._=setTimeout(()=>t.className='',2400)}
function log(m,c=''){const d=document.createElement('div');d.className=c;d.textContent=m;$('#log').prepend(d)}
function penalty(m,id){S.score=Math.max(0,S.score-5);toast('⚠ '+m,1);log(m,'e');if(id){const e=$('#p-'+id);e.classList.add('bad');setTimeout(()=>e.classList.remove('bad'),400)}hud()}
function hud(){$('#score').textContent=S.score;$('#steps').textContent=S.steps;const n=P.filter(p=>S.on[p.id]).length;$('#pc').textContent=n+'/'+P.length;$('#bar').style.width=n/P.length*100+'%'}
function startTimer(){if(S.t0)return;S.t0=Date.now();S.tm=setInterval(()=>{const s=Math.floor((Date.now()-S.t0)/1000);$('#time').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')},500)}
function stopTimer(){clearInterval(S.tm)}
function paint(){stage.className=($('#lblT').checked&&S.mode!=='quiz'?'':'nolbl')+(S.mode==='asm'?' asm':'');
stage.id='stage';P.forEach(p=>{const e=$('#p-'+p.id);e.classList.toggle('on',!!S.on[p.id]);e.classList.toggle('off',!S.on[p.id]);e.classList.toggle('pick',S.sel===p.id)});
const tr=$('#tray');tr.innerHTML='';const off=P.filter(p=>!S.on[p.id]);
if(!off.length)tr.innerHTML='<span style="color:var(--mute);font-size:.8rem">'+(S.mode==='asm'?'Kumpleto na ang PC! ✅':'Walang natanggal na parte.')+'</span>';
off.forEach(p=>{const b=document.createElement('button');b.className='chip'+(S.sel===p.id?' sel':'');b.textContent=p.name;b.onclick=()=>{if(S.mode==='asm'){S.sel=S.sel===p.id?null:p.id;info(p);paint()}else info(p)};tr.appendChild(b)});hud()}
function info(p){$('#info').innerHTML='<h3>📘 Impormasyon</h3><div class="nm">'+p.name+'</div><p><b>Gamit:</b> '+p.fn+'</p><p><b>Tip:</b> '+p.tip+'</p><p><b>Dependency:</b> '+(p.deps.length?p.deps.map(d=>by(d).name).join(', '):'Wala (pwedeng unahin)')+'</p>'}
function strapOK(){if($('#strap').checked||S.auto)return true;const e=$('#esd');e.classList.add('warn');setTimeout(()=>e.classList.remove('warn'),1800);toast('Isuot muna ang anti-static wrist strap para iwas ESD!',1);return false}
function remove(p){const b=P.filter(q=>S.on[q.id]&&q.deps.includes(p.id));if(b.length)return penalty('Tanggalin muna ang: '+b.map(x=>x.name).join(', '),p.id),false;
S.on[p.id]=0;S.steps++;log('Tinanggal: '+p.name,'g');return true}
function install(p){const m=p.deps.filter(d=>!S.on[d]);if(m.length)return penalty('Ikabit muna ang: '+m.map(d=>by(d).name).join(', '),p.id),false;
S.on[p.id]=1;S.steps++;if(S.sel===p.id)S.sel=null;log('Naikabit: '+p.name,'g');return true}
function click(p){
if(S.mode==='quiz')return quizClick(p);
if(S.mode==='explore'||(S.mode==='dis'&&!S.on[p.id])){info(p);return}
if(!strapOK())return;startTimer();
if(S.mode==='dis'){if(remove(p)){info(p);if(!P.some(q=>S.on[q.id]))done('Disassembly')}}
else if(S.mode==='asm'){if(S.on[p.id]){info(p);return}
if(S.sel&&S.sel!==p.id)return penalty('Maling slot! Hindi iyan ang '+by(S.sel).name,p.id);
if(install(p)){info(p);if(P.every(q=>S.on[q.id]))done('Assembly')}}
paint()}
function done(n){stopTimer();const t=$('#time').textContent;toast('🎉 Tapos na ang '+n+'! Score '+S.score+' · '+t);log(n+' complete — Score '+S.score+', oras '+t,'g')}
function setMode(m){S.auto=false;S.mode=m;S.sel=null;S.score=100;S.steps=0;S.t0=0;stopTimer();$('#time').textContent='0:00';
P.forEach(p=>S.on[p.id]=m==='asm'?0:1);S.quiz=null;
document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id==='t-'+m));
$('#auto').style.display=(m==='dis'||m==='asm')?'':'none';$('#auto').textContent=m==='dis'?'▶ Auto Disassemble':'▶ Auto Assemble';
$('#log').innerHTML='';
const msg={explore:'I-click ang parte para makita ang detalye.',dis:'Tanggalin ang mga parte sa tamang pagkakasunod-sunod (kabaligtaran ng pagkakabit).',asm:'Pumili sa tray, saka i-click ang tamang slot. Sundin ang tamang order.',quiz:'Hanapin ang parte na itatanong. 10 rounds!'}[m];
log(msg);toast(msg);if(m==='quiz')nextQ();paint()}
function nextQ(){if(S.quiz===null||S.quiz===undefined||S.quiz.n===undefined)S.quiz={n:0,ok:0};
if(S.quiz.n>=10){toast('🏁 Quiz tapos! '+S.quiz.ok+'/10 tama',0);log('Final: '+S.quiz.ok+'/10','g');S.quiz.cur=null;$('#info').innerHTML='<h3>🎯 Resulta</h3><div class="nm">'+S.quiz.ok+' / 10</div><p>Pindutin ang Quiz ulit para mag-retry.</p>';return}
S.quiz.cur=P[Math.floor(Math.random()*P.length)];$('#info').innerHTML='<h3>🎯 Round '+(S.quiz.n+1)+'/10</h3><div class="nm">Hanapin: '+S.quiz.cur.name+'</div><p>Hint: '+S.quiz.cur.fn+'</p>'}
function quizClick(p){const q=S.quiz;if(!q||!q.cur)return;q.n++;
if(p.id===q.cur.id){q.ok++;S.score+=0;log('✔ Tama: '+p.name,'g');toast('✔ Tama!')}else{log('✖ Mali. Ito ay '+p.name+', hindi '+q.cur.name,'e');toast('✖ Mali! Ito ay '+p.name,1)}
nextQ()}
$('#reset').onclick=()=>setMode(S.mode);$('#lblT').onchange=paint;
$('#auto').onclick=async()=>{if(S.auto)return;setMode(S.mode);const m=S.mode;S.auto=true;
const order=m==='dis'?[...P].reverse():P;
for(const p of(m==='dis'?[...P].sort((a,b)=>depth(b)-depth(a)):[...P].sort((a,b)=>depth(a)-depth(b)))){if(!S.auto)return;await new Promise(r=>setTimeout(r,550));(m==='dis'?remove(p):install(p));info(p);paint()}
S.auto=false;stopTimer()};
function depth(p){return p.deps.length?1+Math.max(...p.deps.map(d=>depth(by(d)))):0}
setMode('explore');
</script></body></html>
